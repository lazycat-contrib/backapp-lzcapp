application:
  subdomain: backapp
  upstreams:
    - location: /
      backend: http://backapp:8080/
services:
  backapp:
    # upstream: ghcr.io/dennis960/backapp:latest@sha256:a1638e29f42295d8514eeaf8256f11e184b43a4ab1355a27d64b9545278807e7
    image: registry.lazycat.cloud/czyt/dennis960/backapp:cf29cac7465d2a6d
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    binds:
      - /lzcapp/var/backapp-data:/data
      - /lzcapp/var/backups/app:/var/backups/app
      - /lzcapp/var/backups/archive:/var/backups/archive
    cpu_shares: 512
    mem_limit: 512M
    entrypoint: sh -c "cd /data &&exec /app/app -port=8080"
